<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Brand color indigo 3-pointed curved star -->
  <path d="M 50 12 Q 57 54 85 80 Q 50 68 15 80 Q 43 54 50 12 Z" fill="#4f46e5" />
  <!-- Overlapping orbital rings -->
  <circle cx="50" cy="53" r="34" fill="none" stroke="#4f46e5" stroke-width="2.5" opacity="0.4" />
  <circle cx="50" cy="53" r="38" fill="none" stroke="#4f46e5" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
  <!-- Ring markers at star points -->
  <circle cx="50" cy="12" r="3.5" fill="none" stroke="#4f46e5" stroke-width="2.5" />
  <circle cx="85" cy="80" r="3.5" fill="none" stroke="#4f46e5" stroke-width="2.5" />
  <circle cx="15" cy="80" r="3.5" fill="none" stroke="#4f46e5" stroke-width="2.5" />
</svg>
